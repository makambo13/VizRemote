name: VizRemote
options:
  bundleIdPrefix: com.example
targets:
  VizRemote:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/VizRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VizRemote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sources/VizRemote/Info.plist
      properties:
        LSUIElement: true
        NSLocalNetworkUsageDescription: "VizRemote finds and controls your VIZIO TV on your local Wi-Fi network."
        NSBonjourServices:
          - _viziocast._tcp
    entitlements:
      path: Sources/VizRemote/VizRemote.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    scheme:
      testTargets:
        - VizRemoteTests

  VizRemoteTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/VizRemoteSharedTests
    dependencies:
      - target: VizRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VizRemoteTests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
