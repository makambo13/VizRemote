name: VizRemote
options:
  bundleIdPrefix: com.example
targets:
  VizRemoteiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/VizRemoteiOS
      - path: Sources/VizRemote/Models.swift
      - path: Sources/VizRemote/SmartCastClient.swift
      - path: Sources/VizRemote/RealSmartCastClient.swift
      - path: Sources/VizRemote/KeychainStore.swift
      - path: Sources/VizRemote/SubnetScanDiscovery.swift
      - path: Sources/VizRemote/ReachabilityMonitor.swift
      - path: Sources/VizRemote/Theme.swift
      - path: Sources/VizRemote/AppModel.swift
      - path: Sources/VizRemote/RemoteViewModel.swift
      - path: Sources/VizRemote/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VizRemote.iOS
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/VizRemoteiOS/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "VizRemote finds and controls your VIZIO TV on your local Wi-Fi network."
        NSBonjourServices:
          - _viziocast._tcp
        UILaunchScreen:
          UIColorName: Background
          UIImageName: LaunchMark
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets:
        - VizRemoteiOSTests

  VizRemoteiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/VizRemoteSharedTests
    dependencies:
      - target: VizRemoteiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VizRemoteiOSTests
        GENERATE_INFOPLIST_FILE: YES
